name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis
          - platform: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Validate versions and signing availability
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Missing updater signing key'; exit 1; }
          node scripts/check-release-version.mjs
      - name: Test portable configuration
        run: node --test tests/config-exchange.test.mjs
      - name: Run conversion and CLI tests natively
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --target ${{ matrix.target }} --tests
      - name: Build signed desktop packages
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build standalone CLI without desktop dependencies
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --no-default-features --bin jisigg-cli --target ${{ matrix.target }}
      - name: Package and smoke test binaries
        run: python scripts/package-release.py --target ${{ matrix.target }} --label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist-release/${{ matrix.label }}/gui/
            dist-release/${{ matrix.label }}/cli/
            dist-release/${{ matrix.label }}/manifest.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Collect validated platform artifacts
        run: |
          mkdir -p dist-release
          for label in windows-x64 linux-x64 macos-x64 macos-arm64; do
            mv "downloaded/release-$label" "dist-release/$label"
          done
      - name: Publish desktop then CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-pair.mjs
