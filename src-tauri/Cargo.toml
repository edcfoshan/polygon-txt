[package]
name = "jisig-bpoint-converter"
version = "1.0.0"
description = "界址点互转工具 — SHP/GDB ↔ TXT 双向转换"
authors = ["极思G"]
edition = "2021"

[lib]
name = "jisig_bpoint_converter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
gdb-write = ["gdal"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = "0.8"
dbase = "0.3"
tempfile = "3"
encoding_rs = "0.8"
geonative-core = "0.2"
geonative-filegdb = "0.2"
geonative-shapefile = "0.2"
gdal = { version = "0.18", optional = true }
