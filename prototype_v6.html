<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界址点互转 — 测镜</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1d20;
  --srf:#242528;
  --srf2:#2a2c30;
  --brd:#333538;
  --tx:#e0ded9;
  --tx2:#8b8986;
  --tx3:#5c5a58;
  --ac:#c9a15e;
  --ach:#d9b97a;
  --acg:rgba(201,161,94,.12);
  --ok:#6b9e7a;
  --er:#b86864;
  --r:6px;
  --t:all .2s cubic-bezier(.4,0,.2,1);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 50% 30%,#2a2c30,#151618);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;color:var(--tx);font-size:13px;
  /* Subtle grid texture */
  background-color:#1a1b1e;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:24px 24px;
}

/* ── Window ── */
.app{
  width:690px;height:448px;
  background:var(--bg);
  border:1px solid #2a2c30;
  border-radius:10px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 1px rgba(0,0,0,.3),
    0 16px 48px rgba(0,0,0,.5);
  position:relative;
}

/* Subtle inner ring glow */
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  z-index:99;
}

/* ── Title Bar ── */
.titlebar{
  height:34px;display:flex;align-items:center;
  padding:0 14px;gap:10px;flex-shrink:0;
  background:linear-gradient(180deg,#2a2c31,#222428);
  border-bottom:1px solid var(--brd);
  -webkit-app-region:drag;
  user-select:none;
}

/* Brass lens ring logo */
.logo-ring{
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--ac);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  flex-shrink:0;
}
.logo-ring::after{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--ac);box-shadow:0 0 6px var(--ac);
}

.logo-text{
  font-family:"DM Serif Display","Noto Serif SC",serif;
  font-size:13px;font-weight:400;letter-spacing:.8px;
  color:var(--tx);font-style:italic;
}
.logo-sub{
  font-size:10px;color:var(--tx3);font-weight:400;
  letter-spacing:1px;margin-left:-4px;
}

.sp{flex:1}

.cfg-area{display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag}
.cfg-area select{
  padding:3px 7px;border:1px solid var(--brd);border-radius:4px;
  font-size:11px;background:var(--srf);color:var(--tx2);outline:none;
  font-family:inherit;cursor:pointer;
}
.cfg-area select:focus{border-color:var(--ac)}
.cfg-area select option{background:var(--srf);color:var(--tx)}

.btn{
  padding:3px 8px;border:1px solid var(--brd);border-radius:4px;
  background:transparent;color:var(--tx3);font-size:10px;
  cursor:pointer;font-family:inherit;transition:var(--t);
}
.btn:hover{background:var(--acg);color:var(--ac);border-color:var(--ac)}

.win-ctls{display:flex;gap:6px;margin-left:6px}
.win-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--brd);
  transition:var(--t)}
.win-dot:hover{background:var(--brd)}

/* ── Tab Bar ── */
.tabbar{
  height:32px;display:flex;align-items:center;
  padding:0 12px;gap:0;flex-shrink:0;
  background:var(--srf);
  border-bottom:1px solid var(--brd);
}
.tab{
  padding:5px 18px;font-size:11px;font-weight:500;color:var(--tx3);
  border:none;background:none;cursor:pointer;font-family:inherit;
  position:relative;transition:var(--t);letter-spacing:.3px;
}
.tab:hover{color:var(--tx2)}
.tab.on{color:var(--ac)}
.tab.on::after{
  content:'';position:absolute;bottom:-1px;left:10px;right:10px;
  height:1.5px;background:var(--ac);border-radius:1px;
}
.tabbar .sp{flex:1}

/* Preset chips */
.chips{display:flex;gap:2px}
.chip{
  padding:2px 8px;border-radius:10px;font-size:10px;
  cursor:pointer;border:1px solid transparent;color:var(--tx3);
  transition:var(--t);font-family:inherit;white-space:nowrap;
}
.chip:hover{color:var(--tx2);border-color:var(--brd)}
.chip.on{background:var(--acg);color:var(--ac);border-color:rgba(201,161,94,.25)}

/* ── Main 3 columns ── */
.main{flex:1;display:flex;overflow:hidden}

/* ── Left Panel ── */
.pnl{display:flex;flex-direction:column;overflow:hidden;transition:width .3s cubic-bezier(.4,0,.2,1)}
.pnl-l{width:195px;background:var(--srf);border-right:1px solid var(--brd);flex-shrink:0}
.pnl-r{width:185px;background:var(--srf);border-left:1px solid var(--brd);flex-shrink:0}
.pnl.hide{width:0!important;min-width:0;border:none;opacity:0;overflow:hidden}
.pnl-h{
  padding:7px 10px;display:flex;align-items:center;gap:6px;
  flex-shrink:0;border-bottom:1px solid var(--brd);
}
.pnl-label{font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:1.2px;text-transform:uppercase;flex:1}
.pnl-tog{
  width:20px;height:20px;border:none;background:none;cursor:pointer;
  font-size:10px;color:var(--tx3);border-radius:4px;
  display:flex;align-items:center;justify-content:center;transition:var(--t);
}
.pnl-tog:hover{background:var(--srf2);color:var(--ac)}
.pnl-bd{flex:1;overflow-y:auto;padding:8px 10px}

/* ── Center ── */
.ctr{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.ctr-bd{flex:1;overflow-y:auto;padding:10px}
.ctr-ft{
  background:var(--srf);border-top:1px solid var(--brd);
  padding:8px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}

/* ── Run button ── */
.btn-run{
  padding:7px 22px;border:none;border-radius:5px;
  background:linear-gradient(135deg,var(--ac),#b8914a);
  color:#1c1d20;font-size:12px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;font-family:inherit;
  transition:var(--t);position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(201,161,94,.25);
}
.btn-run:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,161,94,.35)}
.btn-run:active{transform:translateY(0)}

/* Progress bar */
.prog{flex:1;height:2px;background:var(--brd);border-radius:1px;overflow:hidden}
.prog-fill{height:100%;background:var(--ac);border-radius:1px;width:0;transition:width .4s}
.prog-txt{font-size:10px;color:var(--tx3);min-width:40px;text-align:right;font-family:"JetBrains Mono",monospace}

/* ── Section cards ── */
.card{margin-bottom:8px}
.card-h{
  display:flex;align-items:center;gap:6px;padding:4px 0;
  cursor:pointer;user-select:none;font-size:11px;color:var(--tx3);
  font-weight:600;letter-spacing:.3px;transition:color .15s;
}
.card-h:hover{color:var(--tx2)}
.card-h .arr{font-size:7px;transition:transform .2s;display:inline-block;color:var(--tx3)}
.card-h .arr.o{transform:rotate(90deg)}
.card-b{padding:0 0 0 16px;display:none}
.card-b.o{display:block}

/* ── Form fields ── */
.fld{margin-bottom:6px}
.fld label{display:block;font-size:9px;color:var(--tx3);margin-bottom:3px;letter-spacing:.3px;font-weight:500}
.fld input,.fld select{
  width:100%;padding:5px 8px;border:1px solid var(--brd);border-radius:4px;
  font-size:11px;background:var(--bg);color:var(--tx);outline:none;
  font-family:inherit;transition:var(--t);
}
.fld input:focus,.fld select:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acg)}
.fld input::placeholder{color:var(--tx3)}
.fld-row{display:flex;gap:5px}
.fld-row .fld{flex:1}

/* ── File Drop ── */
.drop{
  border:1px dashed var(--brd);border-radius:6px;padding:12px;
  text-align:center;cursor:pointer;transition:var(--t);
  background:var(--bg);
}
.drop:hover{border-color:var(--ac);background:var(--acg)}
.drop-ic{font-size:18px;margin-bottom:3px;opacity:.4}
.drop-tx{font-size:10px;color:var(--tx3)}
.file-list{max-height:60px;overflow-y:auto;margin-top:5px}
.fitem{
  display:flex;align-items:center;gap:6px;padding:3px 7px;
  background:var(--bg);border-radius:4px;margin-bottom:2px;font-size:10px;
}
.fitem .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.fitem .fs{color:var(--tx3);font-size:9px}
.fitem button{border:none;background:none;cursor:pointer;color:var(--tx3);font-size:11px;padding:0 2px}
.fitem button:hover{color:var(--er)}

/* ── Checkboxes ── */
.ck{display:flex;align-items:center;gap:5px;font-size:10px;padding:1.5px 0;cursor:pointer;color:var(--tx2)}
.ck input{accent-color:var(--ac);width:12px;height:12px}

/* ── Header editor ── */
.hcfg{background:var(--bg);border-radius:5px;padding:7px;border:1px solid var(--brd)}
.hrow{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.hrow label{width:36px;text-align:right;color:var(--tx3);flex-shrink:0;font-size:9px}
.hrow input,.hrow select{
  flex:1;padding:3px 5px;border:1px solid var(--brd);border-radius:3px;
  font-size:10px;background:var(--srf);color:var(--tx);outline:none;font-family:inherit;
}
.hrow input:focus,.hrow select:focus{border-color:var(--ac)}

/* ── Preview ── */
.pv{
  font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  font-size:10px;line-height:1.55;padding:8px 10px;
  border-radius:5px;white-space:pre;overflow-y:auto;
  max-height:110px;
  background:#1a1b1e;
  color:#a8c8a0;
  border:1px solid var(--brd);
  position:relative;
}
/* Brass corner accent */
.pv::before{
  content:'';position:absolute;top:0;left:0;
  width:8px;height:1px;background:var(--ac);
  border-radius:0 0 1px 0;
}

/* ── Result tags ── */
.rtags{display:flex;flex-wrap:wrap;gap:3px}
.rtag{padding:2px 7px;border-radius:3px;font-size:10px}
.rtag.ok{background:rgba(107,158,122,.15);color:var(--ok)}
.rtag.er{background:rgba(184,104,100,.15);color:var(--er)}
.rtag.pd{background:rgba(201,161,94,.1);color:var(--ac)}
.lnk{font-size:9px;color:var(--ac);cursor:pointer;margin-top:5px;display:inline-block}
.lnk:hover{text-decoration:underline}
.logbox{
  background:#1a1b1e;border:1px solid var(--brd);border-radius:5px;
  padding:6px;font-family:"JetBrains Mono",monospace;font-size:9px;
  max-height:48px;overflow-y:auto;margin-top:4px;display:none;
  color:var(--tx2);line-height:1.5;
}
.logbox.on{display:block}

/* ── Section label ── */
.slabel{font-size:8px;font-weight:700;color:var(--tx3);letter-spacing:1px;padding:6px 0 4px;text-transform:uppercase}

/* ── Divider ── */
.div{height:1px;background:var(--brd);margin:6px 0;opacity:.5}

/* ── Toast ── */
.toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);
  background:var(--srf2);color:var(--tx);padding:6px 16px;
  border-radius:5px;font-size:11px;z-index:999;display:none;
  border:1px solid var(--brd);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeIn .4s ease both}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
</style>
</head>
<body>

<div class="app">

  <!-- ═══ Title Bar ═══ -->
  <div class="titlebar">
    <div class="logo-ring"></div>
    <span class="logo-text">测镜</span>
    <span class="logo-sub">TX↔GDB</span>
    <div class="sp"></div>
    <div class="cfg-area">
      <select id="cs" onchange="ld(this.value)"><option value="">预设配置…</option></select>
      <button class="btn" onclick="sv()" title="保存">保存</button>
      <button class="btn" onclick="nw()" title="新建">新建</button>
      <button class="btn" onclick="ex()" title="导出">导出</button>
      <button class="btn" onclick="im()" title="导入">导入</button>
    </div>
    <div class="win-ctls">
      <div class="win-dot"></div>
      <div class="win-dot"></div>
      <div class="win-dot"></div>
    </div>
  </div>

  <!-- ═══ Tab Bar ═══ -->
  <div class="tabbar">
    <button class="tab on" data-t="s" onclick="sw('s')">面 → TXT</button>
    <button class="tab" data-t="t" onclick="sw('t')">TXT → 面</button>
    <div class="sp"></div>
    <div class="chips" id="ch"></div>
  </div>

  <!-- ═══ Main ═══ -->
  <div class="main">

    <!-- Left Panel: Input + Fields -->
    <div class="pnl pnl-l" id="L">
      <div class="pnl-h">
        <span class="pnl-label">输入设置</span>
        <button class="pnl-tog" onclick="tp('L')">◀</button>
      </div>
      <div class="pnl-bd">
        <!-- File -->
        <div class="drop" onclick="af()">
          <div class="drop-ic">＋</div>
          <div class="drop-tx">选择 shp / gdb 文件</div>
        </div>
        <div class="file-list" id="fl"></div>

        <div class="div"></div>

        <div class="card">
          <div class="card-h" onclick="tg(this)"><span class="arr o">▶</span>字段映射</div>
          <div class="card-b o">
            <div class="fld"><label>地块名称</label><select id="fn"><option>DKMC</option><option>MC</option><option>NAME</option></select></div>
            <div class="fld"><label>地块编号</label><select id="fi"><option>DKBH</option><option>BH</option><option>ID</option></select></div>
            <div class="fld-row">
              <div class="fld"><label>面积</label><select id="fa"><option value="">自动</option><option>MJ</option></select></div>
              <div class="fld"><label>用途</label><select id="fu"><option value="">默认</option><option>DKYT</option></select></div>
            </div>
            <div class="fld-row">
              <div class="fld"><label>图幅号</label><select id="fm"><option value="">默认</option><option>TFH</option></select></div>
              <div class="fld"><label>地类</label><select id="fd"><option value="">默认</option><option>DLBM</option></select></div>
            </div>
          </div>
        </div>

        <div class="div"></div>

        <div class="card">
          <div class="card-h" onclick="tg(this)"><span class="arr">▶</span>输出目录</div>
          <div class="card-b">
            <div class="fld" style="display:flex;gap:3px">
              <input type="text" value="D:\output\txt" style="flex:1">
              <button class="btn" style="padding:5px 10px;font-size:10px">浏览</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Center: Preview + Results -->
    <div class="ctr">
      <div class="ctr-bd">
        <!-- Preview Card -->
        <div class="card">
          <div class="card-h" onclick="tg(this)"><span class="arr o">▶</span>表头预览</div>
          <div class="card-b o"><div class="pv" id="pv"></div></div>
        </div>

        <!-- Results Card -->
        <div class="card">
          <div class="card-h" onclick="tg(this)"><span class="arr o">▶</span>转换结果</div>
          <div class="card-b o">
            <div class="rtags" id="rl"><span style="color:var(--tx3);font-size:10px">等待文件…</span></div>
            <span class="lnk" onclick="document.getElementById('lb').classList.toggle('on')">查看日志 ▸</span>
            <div class="logbox" id="lb"></div>
          </div>
        </div>
      </div>

      <!-- Run Bar -->
      <div class="ctr-ft">
        <button class="btn-run" onclick="run()">开始转换</button>
        <div class="prog"><div class="prog-fill" id="pf"></div></div>
        <span class="prog-txt" id="ps">就绪</span>
      </div>
    </div>

    <!-- Right Panel: Params + Header -->
    <div class="pnl pnl-r" id="R">
      <div class="pnl-h">
        <button class="pnl-tog" onclick="tp('R')">▶</button>
        <span class="pnl-label">参数设置</span>
      </div>
      <div class="pnl-bd">
        <div class="slabel">坐标参数</div>
        <div class="fld-row">
          <div class="fld"><label>小数位</label><input type="number" id="pp" value="3" min="0" max="10"></div>
          <div class="fld"><label>带号</label><select id="pz"><option value="auto">自动</option><option>36</option><option>37</option><option>38</option><option>39</option><option>40</option></select></div>
        </div>
        <div class="fld"><label>缓冲区（米）</label><input type="number" id="pb" value="0" min="0"></div>

        <div class="div"></div>

        <div class="slabel">转换选项</div>
        <label class="ck"><input type="checkbox" id="ox">XY 坐标标反</label>
        <label class="ck"><input type="checkbox" id="oj" checked>点号前加"J"</label>
        <label class="ck"><input type="checkbox" id="op">部件号从 1 开始</label>
        <label class="ck"><input type="checkbox" id="on">起始点西北角</label>
        <label class="ck"><input type="checkbox" id="oo" checked>首末点重合</label>
        <label class="ck"><input type="checkbox" id="om">合并到一个 TXT</label>

        <div class="div"></div>

        <div class="slabel">自定义表头</div>
        <div class="hcfg">
          <div class="hrow"><label>坐标系</label><input id="hc" value="2000国家大地坐标系" oninput="up()"></div>
          <div class="hrow"><label>分带</label><select id="hb" onchange="up()"><option>3</option><option>6</option></select></div>
          <div class="hrow"><label>投影</label><input id="hj" value="高斯克吕格" oninput="up()"></div>
          <div class="hrow"><label>单位</label><input id="hu" value="米" oninput="up()"></div>
          <div class="hrow"><label>带号</label><input id="hz" value="38" oninput="up()"></div>
          <div class="hrow"><label>精度</label><input id="ha" value="0.001" oninput="up()"></div>
          <div class="hrow"><label>参数</label><input id="ht" value=",,,,,," oninput="up()"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ═══ Presets ═══
const PP=[
  {id:'basic',n:'基础地块',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'38',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'auto',pb:0,ox:0,oj:1,op:0,on:0,oo:1,om:0},f:{fn:'DKMC',fi:'DKBH',fa:'',fu:'',fm:'',fd:''}},
  {id:'gov',n:'规划审批',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'38',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'auto',pb:0,ox:0,oj:1,op:0,on:0,oo:1,om:0},f:{fn:'DKMC',fi:'DKBH',fa:'MJ',fu:'DKYT',fm:'TFH',fd:'DLBM'}},
  {id:'svy',n:'工程测绘',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'37',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'37',pb:0,ox:1,oj:1,op:1,on:0,oo:1,om:0},f:{fn:'NAME',fi:'BH',fa:'AREA',fu:'',fm:'',fd:''}},

let cur='basic',cfgs={};
function $(id){return document.getElementById(id)}

function init(){
  const s=localStorage.getItem('tg_dark');if(s)cfgs=JSON.parse(s);
  PP.forEach(p=>{if(!cfgs[p.id])cfgs[p.id]=p});
  const sel=$('cs');sel.innerHTML='<option value="">预设配置…</option>';
  Object.values(cfgs).forEach(c=>sel.innerHTML+=`<option value="${c.id}">${c.n}</option>`);
  const ch=$('ch');ch.innerHTML='';
  PP.forEach(p=>ch.innerHTML+=`<span class="chip${p.id===cur?' on':''}" onclick="ld('${p.id}')">${p.n}</span>`);
  ld(localStorage.getItem('tg_last')||'basic');
  document.querySelectorAll('#R input,#R select,.pnl-l select').forEach(e=>e.addEventListener('change',()=>{up();as()}));
  up();
}

function ld(id){
  if(!id)return;const c=cfgs[id]||PP.find(p=>p.id===id);if(!c)return;cur=id;
  if(c.h){$('hc').value=c.h.c;$('hb').value=c.h.b;$('hj').value=c.h.j;$('hu').value=c.h.u;$('hz').value=c.h.z;$('ha').value=c.h.a;$('ht').value=c.h.t}
  if(c.p){$('pp').value=c.p.pp;$('pz').value=c.p.pz;$('pb').value=c.p.pb;$('ox').checked=!!c.p.ox;$('oj').checked=!!c.p.oj;$('op').checked=!!c.p.op;$('on').checked=!!c.p.on;$('oo').checked=!!c.p.oo;$('om').checked=!!c.p.om}
  if(c.f)Object.keys(c.f).forEach(k=>{const e=$(k);if(e)e.value=c.f[k]});
  $('cs').value=id;
  document.querySelectorAll('.chip').forEach(e=>e.classList.remove('on'));
  const cp=document.querySelector(`.chip[onclick*="${id}"]`);if(cp)cp.classList.add('on');
  localStorage.setItem('tg_last',id);up();
}

function sv(){const c=g();cfgs[c.id]=c;localStorage.setItem('tg_dark',JSON.stringify(cfgs));const s=$('cs');if(!s.querySelector(`[value="${c.id}"]`))s.innerHTML+=`<option value="${c.id}">${c.n}</option>`;toast('已保存 「'+c.n+'」')}
function nw(){const n=prompt('配置名称:');if(!n)return;const c=g();c.id='u'+Date.now();c.n=n;cfgs[c.id]=c;localStorage.setItem('tg_dark',JSON.stringify(cfgs));$('cs').innerHTML+=`<option value="${c.id}">${c.n}</option>`;$('cs').value=c.id;cur=c.id;toast('已创建 「'+n+'」')}
function ex(){const c=g();const b=new Blob([JSON.stringify(c,null,2)]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=c.n+'.json';a.click();toast('已导出')}
function im(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=ev=>{try{const c=JSON.parse(ev.target.result);c.id='u'+Date.now();cfgs[c.id]=c;localStorage.setItem('tg_dark',JSON.stringify(cfgs));ld(c.id);init();toast('已导入 「'+c.n+'」')}catch{toast('导入失败')}};r.readAsText(e.target.files[0])};i.click()}
function g(){return{id:cur,n:cfgs[cur]?.n||'默认',h:{c:$('hc').value,b:$('hb').value,j:$('hj').value,u:$('hu').value,z:$('hz').value,a:$('ha').value,t:$('ht').value},p:{pp:+$('pp').value,pz:$('pz').value,pb:+$('pb').value,ox:$('ox').checked?1:0,oj:$('oj').checked?1:0,op:$('op').checked?1:0,on:$('on').checked?1:0,oo:$('oo').checked?1:0,om:$('om').checked?1:0},f:{fn:$('fn').value,fi:$('fi').value,fa:$('fa').value,fu:$('fu').value,fm:$('fm').value,fd:$('fd').value}}}
function as(){const c=g();cfgs[c.id]=c;localStorage.setItem('tg_dark',JSON.stringify(cfgs))}

function up(){
  $('pv').textContent=
`[属性描述]
坐标系=${$('hc').value}
几度分带=${$('hb').value}
投影类型=${$('hj').value}
计量单位=${$('hu').value}
带号=${$('hz').value}
精度=${$('ha').value}
转换参数=${$('ht').value}
[地块坐标]`;
}

function sw(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.querySelector(`[data-t="${t}"]`).classList.add('on')}
function tp(id){$(id).classList.toggle('hide')}
function tg(h){const a=h.querySelector('.arr'),b=h.nextElementSibling;a.classList.toggle('o');b.classList.toggle('o')}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}

// ═══ Demo files ═══
const DF=[{n:'城东新区地块.shp',s:'2.3MB'},{n:'供地项目2024.shp',s:'5.1MB'},{n:'调查数据.gdb',s:'12MB'}];
function af(){const l=$('fl');if(l.children.length)return;DF.forEach(f=>{const d=document.createElement('div');d.className='fitem';d.innerHTML=`<span class="fn">◈ ${f.n}</span><span class="fs">${f.s}</span><button onclick="this.parentElement.remove()">×</button>`;l.appendChild(d)})}

// ═══ Run simulation ═══
function run(){
  const pf=$('pf'),ps=$('ps'),rl=$('rl'),lb=$('lb');
  rl.innerHTML='';lb.innerHTML='';lb.classList.add('on');let i=0;
  log('◆ 开始批量转换 — 共 '+DF.length+' 个文件');
  function nx(){
    if(i>=DF.length){pf.style.width='100%';ps.textContent='完成';log('◆ 全部转换完成');return}
    const f=DF[i];pf.style.width=((i+.5)/DF.length*100)+'%';ps.textContent=(i+1)+'/'+DF.length;
    log('· 处理 → '+f.n);
    const t=document.createElement('span');t.className='rtag pd';t.textContent='↻ '+f.n;rl.appendChild(t);
    setTimeout(()=>{
      const ok=Math.random()>.12;
      t.className='rtag '+(ok?'ok':'er');t.textContent=(ok?'✓ ':'✗ ')+f.n;
      log(ok?'  ✓ 完成 '+f.n:'  ✗ 失败 '+f.n);
      i++;nx();
    },350+Math.random()*250);
  }nx();
}
function log(m){
  const b=$('lb'),d=document.createElement('div');
  d.style.color=m.includes('✗')?'var(--er)':m.includes('✓')?'var(--ok)':'var(--tx2)';
  d.textContent=m;b.appendChild(d);b.scrollTop=b.scrollHeight;
}

init();
