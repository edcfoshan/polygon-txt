[package]
name = "jisig-bpoint-converter"
version = "2.0.0"
description = "界址点互转工具 — SHP/GDB ↔ TXT 双向转换"
authors = ["极思G"]
edition = "2021"
default-run = "jisig-bpoint-converter"

[lib]
name = "jisig_bpoint_converter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "diag_read_gdb"
path = "bin/diag_read_gdb.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = "0.8"
dbase = "0.3"
tempfile = "3"
encoding_rs = "0.8"
geonative-core = "0.2"
geonative-filegdb = "0.2"
geonative-shapefile = "0.2"
geo-types = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
proj-core = "0.9"
