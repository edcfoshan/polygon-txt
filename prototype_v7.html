<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>界址点互转 — 测镜 v7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   THEME TOKENS — Light (default) & Dark
   ═══════════════════════════════════════════ */
:root,[data-t="light"]{
  --bg:#ffffff;
  --srf:#fbfbfa;
  --srf2:#f4f3ef;
  --srf3:#ffffff;
  --brd:#e7e5e0;
  --brd2:#d6d3cc;
  --tx:#1a1a1c;
  --tx2:#5b5a55;
  --tx3:#8a8780;
  --ac:#9a6f1f;          /* deeper, refined for white */
  --ach:#7d5a16;
  --acg:rgba(154,111,31,.10);
  --ok:#3f7a55;
  --er:#a8453e;
  --shadow-sm:0 1px 2px rgba(20,18,12,.06);
  --shadow-md:0 4px 16px rgba(20,18,12,.08);
  --shadow-lg:0 24px 60px rgba(20,18,12,.12);
  --ring:inset 0 1px 0 rgba(255,255,255,.9);
  --pv-bg:#f7f5f0;
  --pv-fg:#2f6b3a;
}
[data-t="dark"]{
  --bg:#16171a;          /* app base */
  --srf:#1d1f23;         /* panel base */
  --srf2:#23252a;        /* raised */
  --srf3:#2a2c31;        /* header bar */
  --brd:#2c2e33;         /* border */
  --brd2:#3a3c42;        /* stronger border */
  --tx:#e8e6e1;          /* primary text */
  --tx2:#9a9792;         /* secondary text */
  --tx3:#62605d;         /* tertiary / label */
  --ac:#c9a55f;          /* primary accent (warm brass) */
  --ach:#dcb777;         /* accent hover */
  --acg:rgba(201,165,95,.14);
  --ok:#7aae8a;
  --er:#c47772;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 18px 48px rgba(0,0,0,.55);
  --ring:inset 0 1px 0 rgba(255,255,255,.04);
  --pv-bg:#0f1013;
  --pv-fg:#a8c8a0;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Inter","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:13px;color:var(--tx);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 25%, var(--srf2) 0%, var(--bg) 60%);
  transition:background .35s ease, color .35s ease;
}
/* Subtle grid */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:32px 32px;
  opacity:.6;
}
:root[data-t="light"] body::before{
  background-image:
    linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.02) 1px,transparent 1px);
}

/* ═══ App window ═══ */
.app{
  width:880px;
  background:var(--srf);
  border:1px solid var(--brd);
  border-radius:12px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg), var(--ring);
  position:relative;
  margin:24px 0;
  transition:background .3s ease, border-color .3s ease, box-shadow .3s ease;
}

/* ═══ Title bar ═══ */
.titlebar{
  height:36px;display:flex;align-items:center;
  padding:0 14px;gap:10px;flex-shrink:0;
  background:linear-gradient(180deg, var(--srf3), var(--srf));
  border-bottom:1px solid var(--brd);
  -webkit-app-region:drag;user-select:none;
}

/* Brand mark — geometric crosshair */
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{
  width:18px;height:18px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.brand-mark::before,.brand-mark::after{
  content:'';position:absolute;background:var(--ac);
  border-radius:1px;transition:background .25s ease;
}
.brand-mark::before{width:2px;height:14px}
.brand-mark::after{height:2px;width:14px;background:var(--ach)}
.brand-mark .dot{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--ac);box-shadow:0 0 0 2px var(--srf3);
  z-index:1;
}
.brand-text{
  font-family:"Inter",sans-serif;
  font-size:13px;font-weight:600;letter-spacing:-.2px;
  color:var(--tx);
}
.brand-text .acc{color:var(--ac);font-weight:700}
.brand-sub{
  font-size:10px;color:var(--tx3);font-weight:500;
  letter-spacing:1.2px;margin-left:-2px;
  padding:1px 5px;border:1px solid var(--brd);border-radius:3px;
}

.spacer{flex:1}

.cfg-area{display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag}
.cfg-area select{
  padding:4px 8px;border:1px solid var(--brd);border-radius:5px;
  font-size:11px;font-weight:500;background:var(--srf2);color:var(--tx2);outline:none;
  font-family:inherit;cursor:pointer;letter-spacing:.2px;
  transition:all .18s ease;
}
.cfg-area select:hover{border-color:var(--brd2);color:var(--tx)}
.cfg-area select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.cfg-area select option{background:var(--srf);color:var(--tx)}
.cfg-name{padding:4px 8px;font-size:11px;font-weight:500;color:var(--tx2);border:1px solid transparent;border-radius:5px;min-width:80px;display:inline-block;cursor:text;outline:none;transition:border-color .15s}
.cfg-name:hover{border-color:var(--brd);background:var(--srf2)}
.cfg-name:focus{border-color:var(--ac);background:var(--srf2);color:var(--tx)}

.btn{
  padding:4px 10px;border:1px solid var(--brd);border-radius:5px;
  background:transparent;color:var(--tx3);font-size:11px;font-weight:500;
  cursor:pointer;font-family:inherit;letter-spacing:0;
  transition:all .18s cubic-bezier(.4,0,.2,1);
}
.btn:hover{background:var(--acg);color:var(--ac);border-color:var(--ac)}

/* Theme toggle */
.theme-toggle{
  width:30px;height:30px;border-radius:6px;
  border:1px solid var(--brd);background:transparent;
  color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.theme-toggle:hover{color:var(--ac);border-color:var(--ac);background:var(--acg)}
.theme-toggle svg{width:14px;height:14px;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.theme-toggle .sun,.theme-toggle .moon{position:absolute;transition:opacity .3s, transform .35s}
:root[data-t="dark"] .theme-toggle .sun{opacity:1;transform:rotate(0) scale(1)}
:root[data-t="dark"] .theme-toggle .moon{opacity:0;transform:rotate(-90deg) scale(.5)}
:root[data-t="light"] .theme-toggle .sun{opacity:0;transform:rotate(90deg) scale(.5)}
:root[data-t="light"] .theme-toggle .moon{opacity:1;transform:rotate(0) scale(1)}

.win-ctls{display:flex;gap:6px;margin-left:4px;-webkit-app-region:no-drag}
.win-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--brd);transition:all .18s}
.win-dot:hover{transform:scale(1.15)}

/* ═══ Tab bar ═══ */
.tabbar{
  height:34px;display:flex;align-items:center;
  padding:0 14px;gap:2px;flex-shrink:0;
  background:var(--srf);
  border-bottom:1px solid var(--brd);
}
.tab{
  padding:6px 16px;font-size:11.5px;font-weight:500;color:var(--tx3);
  border:none;background:none;cursor:pointer;font-family:inherit;
  position:relative;transition:color .2s;letter-spacing:.2px;
  border-radius:5px;
}
.tab:hover{color:var(--tx2);background:var(--srf2)}
.tab.on{color:var(--ac)}
.tab.on::after{
  content:'';position:absolute;bottom:-1px;left:14px;right:14px;
  height:2px;background:var(--ac);border-radius:1px 1px 0 0;
  box-shadow:0 -1px 6px var(--acg);
}

.chips{display:flex;gap:2px;align-items:center}
.chip{
  padding:4px 10px;border-radius:12px;font-size:11px;font-weight:500;
  cursor:pointer;border:1px solid transparent;color:var(--tx3);
  transition:all .2s cubic-bezier(.4,0,.2,1);font-family:inherit;white-space:nowrap;
}
.chip:hover{color:var(--tx2);border-color:var(--brd);background:var(--srf2)}
.chip.on{background:var(--acg);color:var(--ac);border-color:rgba(201,165,95,.3)}

/* ═══ Main / Panels ═══ */
.main{flex:1;display:flex;overflow:hidden}

.pnl{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--srf);
  transition:width .32s cubic-bezier(.4,0,.2,1), opacity .25s, border-color .3s;
}
.pnl-l{width:220px;border-right:1px solid var(--brd);flex-shrink:0}
.pnl-m{width:220px;border-right:1px solid var(--brd);flex-shrink:0}
/* Compact middle panel — no scroll */
.pnl-m .pnl-bd{padding:6px 10px}
.pnl-m .slabel{padding:4px 0 3px;font-size:11px}
.pnl-m .fld{margin-bottom:4px}
.pnl-m .fld label{margin-bottom:2px;font-size:10px}
.pnl-m .fld input,.pnl-m .fld select{padding:4px 6px;font-size:11px}
.pnl-m .div{margin:4px 0}
.pnl-m .ck{padding:1px 0;font-size:11px;gap:5px}
.pnl-m .ck input{width:11px;height:11px}
.pnl-m .ck-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px 4px}
.pnl-m .hcfg{padding:5px}
.pnl-m .hrow{margin-bottom:1px}
.pnl-m .hrow label{font-size:10px;width:34px}
.pnl-m .hrow input,.pnl-m .hrow select{padding:4px 6px;font-size:11px}
/* Header inner tabs */
.hdr-tabs{display:flex;border-bottom:1px solid var(--brd);margin-bottom:4px}
.hdr-tab{flex:1;text-align:center;padding:4px 0;font-size:11px;font-weight:500;color:var(--tx3);cursor:pointer;border-bottom:1.5px solid transparent;transition:all .15s;font-family:inherit}
.hdr-tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.hdr-panel{display:none}
.hdr-panel.on{display:block}
.hdr-textarea{width:100%;height:170px;border:1px solid var(--brd);border-radius:5px;padding:5px;font-family:"JetBrains Mono",monospace;font-size:9px;line-height:1.55;resize:none;background:var(--bg);color:var(--tx);outline:none}
:root[data-t="light"] .hdr-textarea{background:#fff}
.hdr-textarea:focus{border-color:var(--ac)}

.pnl.hide{width:0!important;min-width:0;border:none;opacity:0}

.pnl-h{
  padding:8px 12px;display:flex;align-items:center;gap:6px;
  flex-shrink:0;border-bottom:1px solid var(--brd);
  background:linear-gradient(180deg, var(--srf3), var(--srf));
}
.pnl-label{
  font-size:11px;font-weight:600;color:var(--tx2);
  letter-spacing:0;flex:1;
}
.pnl-tog{
  width:20px;height:20px;border:none;background:none;cursor:pointer;
  font-size:9px;color:var(--tx3);border-radius:4px;
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.pnl-tog:hover{background:var(--srf2);color:var(--ac)}
.pnl-bd{flex:1;overflow-y:auto;padding:10px 12px}

/* Center */
.ctr{width:360px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.ctr-bd{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column}
.ctr-ft{
  background:var(--srf);border-top:1px solid var(--brd);
  padding:9px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}

/* Run button — refined brass */
.btn-run{
  padding:8px 24px;border:none;border-radius:6px;
  background:linear-gradient(180deg, var(--ach), var(--ac));
  color:#1a1a1c;font-size:12px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;font-family:inherit;
  transition:all .22s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm), 0 1px 0 rgba(255,255,255,.2) inset;
}
.btn-run::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 50%);
  pointer-events:none;
}
.btn-run:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--acg), 0 1px 0 rgba(255,255,255,.25) inset}
.btn-run:active{transform:translateY(0)}

/* Progress */
.prog{flex:1;height:3px;background:var(--srf2);border-radius:2px;overflow:hidden;border:1px solid var(--brd)}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg, var(--ac), var(--ach));
  border-radius:2px;width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px var(--acg);
}
.prog-txt{font-size:10.5px;color:var(--tx3);min-width:46px;text-align:right;font-family:"JetBrains Mono",monospace;font-weight:500;letter-spacing:.3px}

/* Cards */
.card{margin-bottom:10px}
.card-h{
  display:flex;align-items:center;gap:6px;padding:5px 0;
  cursor:pointer;user-select:none;font-size:11px;color:var(--tx2);
  font-weight:600;letter-spacing:0;transition:color .15s;
}
.card-h:hover{color:var(--tx)}
.card-h .arr{font-size:7px;transition:transform .25s cubic-bezier(.4,0,.2,1);display:inline-block;color:var(--tx3)}
.card-h .arr.o{transform:rotate(90deg)}
.card-b{padding:2px 0 0 16px;display:none;animation:slideIn .25s ease}
.card-b.o{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

/* Form fields */
.fld{margin-bottom:7px}
.fld label{
  display:block;font-size:10px;color:var(--tx3);margin-bottom:4px;
  letter-spacing:0;font-weight:500;white-space:nowrap;
}
.fld input,.fld select{
  width:100%;padding:4px 6px;border:1px solid var(--brd);border-radius:4px;
  font-size:11px;background:var(--bg);color:var(--tx);outline:none;
  font-family:inherit;transition:all .18s;
}
:root[data-t="light"] .fld input,:root[data-t="light"] .fld select{background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acg)}
.fld input::placeholder{color:var(--tx3)}
.fld-row{display:flex;gap:6px}
.fld-row .fld{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px}
.fcell label{display:block;font-size:10px;color:var(--tx3);margin-bottom:1px;font-weight:500;letter-spacing:0;white-space:nowrap}
.fcell select,.fcell input{width:100%;padding:4px 6px;border:1px solid var(--brd);border-radius:4px;font-size:11px;line-height:1.5;background:var(--bg);color:var(--tx);outline:none;font-family:inherit}
.fcell select:focus,.fcell input:focus{border-color:var(--ac)}
.fcell-full{grid-column:1/-1}
.fci{height:26px}
:root[data-t="light"] .fcell select,:root[data-t="light"] .fcell input{background:#fff}

/* File drop */
.drop{
  border:1.5px dashed var(--brd);border-radius:7px;padding:14px 10px;
  text-align:center;cursor:pointer;transition:all .2s;
  background:var(--bg);
}
:root[data-t="light"] .drop{background:#fff}
.drop:hover{border-color:var(--ac);background:var(--acg);transform:translateY(-1px)}
.drop-ic{
  width:28px;height:28px;margin:0 auto 5px;border-radius:50%;
  background:var(--srf2);display:flex;align-items:center;justify-content:center;
  color:var(--ac);font-size:14px;font-weight:300;
  border:1px solid var(--brd);transition:all .25s;
}
.drop:hover .drop-ic{background:var(--ac);color:#1a1a1c;border-color:var(--ac);transform:rotate(90deg)}
.drop-tx{font-size:10.5px;color:var(--tx3);font-weight:500;letter-spacing:.2px}
.file-list{max-height:120px;overflow-y:auto;margin-top:4px;border:1px solid var(--brd);border-radius:4px;padding:2px}
.fitem{
  display:flex;align-items:center;gap:6px;padding:4px 8px;
  background:var(--bg);border:1px solid var(--brd);border-radius:5px;
  margin-bottom:3px;font-size:10.5px;
  transition:all .18s;
}
:root[data-t="light"] .fitem{background:#fff}
.fitem:hover{border-color:var(--brd2);background:var(--srf2)}
.fitem .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2);font-weight:500}
.fitem .fs{color:var(--tx3);font-size:9px;font-family:"JetBrains Mono",monospace}
.fitem button{
  border:none;background:none;cursor:pointer;color:var(--tx3);
  font-size:13px;padding:0 3px;line-height:1;transition:color .15s;
  font-weight:300;
}
.fitem button:hover{color:var(--er)}

/* Checkboxes */
.ck{display:flex;align-items:center;gap:7px;font-size:11px;padding:2.5px 0;cursor:pointer;color:var(--tx);transition:color .15s}
.ck:hover{color:var(--tx)}
.ck input{accent-color:var(--ac);width:13px;height:13px;cursor:pointer}

/* Section label */
.slabel{
  font-size:11px;font-weight:600;color:var(--tx2);
  letter-spacing:0;padding:7px 0 5px;
  display:flex;align-items:center;gap:6px;
}
.slabel::after{content:'';flex:1;height:1px;background:var(--brd);opacity:.5}

/* Header editor */
.hcfg{background:var(--bg);border-radius:6px;padding:8px;border:1px solid var(--brd)}
:root[data-t="light"] .hcfg{background:#fff}
.hrow{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.hrow label{
  width:34px;text-align:right;color:var(--tx3);flex-shrink:0;
  font-size:10px;font-weight:500;letter-spacing:0;
}
.hrow input,.hrow select{
  flex:1;padding:4px 6px;border:1px solid var(--brd);border-radius:4px;
  font-size:11px;background:var(--srf);color:var(--tx);outline:none;font-family:inherit;
  transition:all .15s;
}
.hrow input:focus,.hrow select:focus{border-color:var(--ac)}

/* Preview */
.pv{
  font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  font-size:10.5px;line-height:1.65;padding:10px 12px;
  border-radius:6px;white-space:pre;overflow-y:auto;
  flex:1;
  background:var(--pv-bg);color:var(--pv-fg);
  border:1px solid var(--brd);
  position:relative;
  box-shadow:var(--shadow-sm);
}
.pv::before{
  content:'';position:absolute;top:0;left:0;
  width:10px;height:1.5px;background:var(--ac);
  border-radius:0 0 1px 0;
}
.pv::after{
  content:'';position:absolute;top:0;left:0;
  width:1.5px;height:10px;background:var(--ac);
  border-radius:0 0 1px 0;
}

/* Result tags */
.rtags{display:flex;flex-wrap:wrap;gap:4px}
.rtag{
  padding:3px 9px;border-radius:11px;font-size:10.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:4px;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.rtag.ok{background:rgba(122,174,138,.15);color:var(--ok);border:1px solid rgba(122,174,138,.25)}
.rtag.er{background:rgba(196,119,114,.15);color:var(--er);border:1px solid rgba(196,119,114,.25)}
.rtag.pd{background:var(--acg);color:var(--ac);border:1px solid rgba(201,165,95,.25)}
.lnk{font-size:10px;color:var(--ac);cursor:pointer;margin-top:6px;display:inline-block;font-weight:500;transition:opacity .15s}
.lnk:hover{text-decoration:underline;opacity:.8}
.logbox{
  background:var(--pv-bg);border:1px solid var(--brd);border-radius:6px;
  padding:7px 9px;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  max-height:52px;overflow-y:auto;margin-top:5px;display:none;
  color:var(--tx2);line-height:1.55;
  box-shadow:var(--shadow-sm);
}
.logbox.on{display:block;animation:slideIn .25s ease}
.logbox div{padding:1px 0}

/* Divider */
.div{height:1px;background:var(--brd);margin:8px 0;opacity:.6}

/* Toast */
.toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-8px);
  background:var(--srf3);color:var(--tx);padding:8px 18px;
  border-radius:7px;font-size:11.5px;z-index:999;display:none;
  border:1px solid var(--brd2);
  box-shadow:var(--shadow-md);
  font-weight:500;letter-spacing:.2px;
  opacity:0;transition:opacity .25s, transform .25s;
}
.toast.on{display:block;opacity:1;transform:translateX(-50%) translateY(0)}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* Enter animation */
.card{animation:fadeIn .4s ease both}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}

<div class="toast" id="toast"></div>

<script>
// ═══ Theme ═══
const params=new URLSearchParams(location.search);
let theme=params.get('mode')==='dark'?'dark':(localStorage.getItem('tg_theme')||'light');
document.documentElement.setAttribute('data-t',theme);
function togTheme(){
  theme=theme==='light'?'dark':'light';
  document.documentElement.setAttribute('data-t',theme);
  localStorage.setItem('tg_theme',theme);
  try{parent.postMessage({t:'theme',v:theme},'*')}catch{}
}

// ═══ File handling ═══
let loadedFiles=[]; // [{shp, dbf, prj, shx, name}]
const FIELD_MATCH_RULES={
  fn:['DKMC','MC','NAME'],
  fi:['DKBH','BH','ID'],
  fa:['MJ','AREA'],
  fu:['DKYT','YT','YONGTU'],
  fm:['TFH'],
  fd:['DLBM','DL']
};

function initFileInput(){
  const drop=document.getElementById('dropZone');
  if(!drop)return;
  drop.addEventListener('click',()=>{
    const inp=document.createElement('input');
    inp.type='file';inp.multiple=true;inp.accept='.shp,.dbf,.prj,.shx';
    inp.onchange=handleFileSelect;
    inp.click();
  });
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--ac)';});
  drop.addEventListener('dragleave',()=>{drop.style.borderColor='';});
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.style.borderColor='';
    handleFiles(e.dataTransfer.files);
  });
}

function handleFileSelect(e){handleFiles(e.target.files)}
function handleFiles(fileList){
  const groups={};
  for(const f of fileList){
    const ext=f.name.split('.').pop().toLowerCase();
    if(!['shp','dbf','prj','shx'].includes(ext)) continue;
    const base=f.name.replace(/\.[^.]+$/,'');
    if(!groups[base]) groups[base]={};
    groups[base][ext]=f;
  }
  loadedFiles.length=0;
  for(const [base,g] of Object.entries(groups)){
    if(g.shp) loadedFiles.push({shp:g.shp, dbf:g.dbf||null, prj:g.prj||null, shx:g.shx||null, name:base});
  }
  if(!loadedFiles.length){toast('请选择 .shp 文件');return;}
  renderFileList();
  processImport();
}

function renderFileList(){
  const fl=$('fl');fl.innerHTML='';
  loadedFiles.forEach((g,i)=>{
    const size=(g.shp.size/1024).toFixed(0)+'KB';
    fl.innerHTML+=`<div class="fitem"><span class="fn">◈ ${g.shp.name}</span><span class="fs">${size}</span><button onclick="removeFile(${i})">×</button></div>`;
  });
}

function removeFile(i){
  loadedFiles.splice(i,1);
  if(!loadedFiles.length){$('fl').innerHTML='';lastPreviewKey='';up();return}
  renderFileList();
}

function clearAllFiles(){
  if(!loadedFiles.length)return;
  loadedFiles.length=0;$('fl').innerHTML='';
  lastPreviewKey='';up();
  toast('已清空全部文件');
}

// ═══ Presets ═══
const PP=[
  {id:'basic',n:'基础地块',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'38',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'auto',pb:0,ox:0,oj:1,op:0,on:0,oo:1,om:0},f:{fn:'DKMC',fi:'DKBH',fa:'',fu:'',fm:'',fd:''}},
  {id:'gov',n:'规划审批',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'38',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'auto',pb:0,ox:0,oj:1,op:0,on:0,oo:1,om:0},f:{fn:'DKMC',fi:'DKBH',fa:'MJ',fu:'DKYT',fm:'TFH',fd:'DLBM'}},
  {id:'usr',n:'自定义',h:{c:'2000国家大地坐标系',b:'3',j:'高斯克吕格',u:'米',z:'38',a:'0.001',t:',,,,,,'},p:{pp:3,pz:'auto',pb:0,ox:0,oj:1,op:0,on:0,oo:1,om:0},f:{fn:'DKMC',fi:'DKBH',fa:'',fu:'',fm:'',fd:''}}
];

let cur='basic',cfgs={},headerManual={},lastPreviewKey='',previewTimer=null;
function $(id){return document.getElementById(id)}

// ═══ Parse engines (Task 2) ═══
async function parseDbfFields(file){
  const buf=await file.arrayBuffer();
  const dv=new DataView(buf);
  const headerLen=dv.getUint16(8,true);
  const recordLen=dv.getUint16(10,true);
  const fieldCount=(headerLen-1-32)/32|0;
  const fields=[];
  for(let i=0;i<fieldCount;i++){
    let name='';
    for(let j=0;j<11;j++){const c=dv.getUint8(32+i*32+j);if(c===0)break;name+=String.fromCharCode(c)}
    const fn=name.trim().toUpperCase();
    if(fn&&fn!='FID'&&fn!='SHAPE'&&fn!='OBJECTID') fields.push(fn);
  }
  return fields;
}

async function parseShpHeader(file){
  const buf=await file.arrayBuffer();
  const dv=new DataView(buf);
  const code=dv.getInt32(0,false);
  if(code!==9994) throw new Error('不是有效的 SHP 文件');
  const bbox=[];
  for(let i=0;i<8;i++) bbox.push(dv.getFloat64(36+i*8,true));
  return {code,bbox};
}

function prjToHeader(prjText){
  const h={};
  if(/CGCS\s*2000|2000.*国家|China.*2000/i.test(prjText)) h.c='2000国家大地坐标系';
  else if(/Xian.*1980|1980.*西安/i.test(prjText)) h.c='1980西安坐标系';
  else if(/Beijing.*1954|1954.*北京/i.test(prjText)) h.c='1954北京坐标系';
  else if(/WGS.*84/i.test(prjText)) h.c='WGS84坐标系';
  if(/Transverse_Mercator|Gauss.*Kruger/i.test(prjText)) h.j='高斯克吕格';
  else if(/Lambert/i.test(prjText)) h.j='兰伯特';
  const cm=prjText.match(/Longitude_Of_Origin["\s,\]]*([\d.]+)/i)||prjText.match(/Central_Meridian["\s,\]]*([\d.]+)/i);
  if(cm){const lon=parseFloat(cm[1]),zone=Math.round(lon/3);h.z=''+zone;h.b='3'}
  if(/UNIT\["Meter/i.test(prjText)) h.u='米';
  else if(/UNIT\["Degree/i.test(prjText)) h.u='度';
  return h;
}

// ═══ Auto-match & header fill (Task 3) ═══
function autoMatchFields(fieldNames){
  for(const [key,rules] of Object.entries(FIELD_MATCH_RULES)){
    const sel=$(key);if(!sel)continue;
    let matched='';
    for(const r of rules){if(fieldNames.includes(r)){matched=r;break}}
    sel.innerHTML='';
    if(!matched) sel.innerHTML='<option value="">无</option>';
    fieldNames.forEach(fn=>{sel.innerHTML+=`<option value="${fn}"${fn===matched?' selected':''}>${fn}</option>`});
  }
}

function autoFillHeader(info){
  const map={c:'hc',b:'hb',j:'hj',u:'hu',z:'hz'};
  for(const [k,id] of Object.entries(map)){
    if(!headerManual[id] && info[k]){
      $(id).value=info[k];
      $(id).style.borderColor='var(--ac)';
      setTimeout(()=>{try{$(id).style.borderColor=''}catch(e){}},2000);
    }
  }
  up();
}

async function processImport(){
  if(!loadedFiles.length) return;
  const g=loadedFiles[0]; // 以第一个文件为准做字段匹配和表头识别
  try{
    await parseShpHeader(g.shp);
    if(g.dbf){
      const fieldNames=await parseDbfFields(g.dbf);
      autoMatchFields(fieldNames);
    }else{toast('缺少 .dbf 文件');}
    if(g.prj){
      const prjText=await g.prj.text();
      const info=prjToHeader(prjText);
      autoFillHeader(info);
    }
    up();toast('文件识别完成（'+loadedFiles.length+' 个文件）');
  }catch(e){console.error(e);toast('文件解析失败: '+e.message)}
}

// ═══ Live preview (Task 4) ═══
function schedulePreview(){
  clearTimeout(previewTimer);
  previewTimer=setTimeout(up,150);
}

function up(){
  const ha=$('ha')?.value||'0.001';
  const hpi=$('hpi')?.value||'';
  let txt='';
  if(hpi.trim()) txt=`[项目信息]
${hpi.trim()}
`;
  txt+=`[属性描述]
坐标系=${$('hc')?$('hc').value:''}
几度分带=${$('hb')?$('hb').value:''}
投影类型=${$('hj')?$('hj').value:''}
计量单位=${$('hu')?$('hu').value:''}
带号=${$('hz')?$('hz').value:''}
精度=${ha}
转换参数=${$('ht')?$('ht').value:''}
[地块坐标]`;

  if(loadedFiles.length){
    const prec=ha==='1'?0:ha==='0.1'?1:ha==='0.01'?2:ha==='0.0001'?4:3;
    const oj=$('oj')?.checked;
    const ox=$('ox')?.checked;
    const MAX_PLOTS=3,MAX_PTS=20;
    const plots=[
      {name:'城东新区A',id:'DK-001',area:'1.2247',use:'住宅用地',tfh:'F49H001',dlbm:'0701',pts:[[2582988.976,38383243.971],[2582983.339,38383261.067],[2582359.231,38383048.719],[2582340.199,38383058.089],[2582350.828,38383026.848],[2582988.976,38383243.971]]},
      {name:'城东新区B',id:'DK-002',area:'0.8912',use:'商业用地',tfh:'F49H002',dlbm:'0501',pts:[[2572612.391,38378180.765],[2572639.371,38378226.143],[2572629.305,38378232.123],[2572598.104,38378188.837],[2572612.391,38378180.765]]},
      {name:'城东新区C',id:'DK-003',area:'2.1045',use:'工业用地',tfh:'F49H003',dlbm:'0601',pts:[[2582813.238,38378141.532],[2582851.765,38378162.077],[2582853.902,38378163.234],[2582813.238,38378141.532]]}
    ];
    const shown=Math.min(plots.length,MAX_PLOTS);
    for(let p=0;p<shown;p++){
      const pl=plots[p];
      const pts=pl.pts.slice(0,MAX_PTS);
      // Real TXT metadata line: 点数,面积,FID_0,地块名,面,图幅号,用途,地类,@ (空字段=无,不填写)
      const metaParts=[pts.length,pl.area,'FID_0'];
      const fnSel=$('fn');metaParts.push(fnSel&&fnSel.value?pl.name:'');
      metaParts.push('面');
      const fmSel=$('fm');metaParts.push(fmSel&&fmSel.value?pl.tfh:'');
      const fuSel=$('fu');metaParts.push(fuSel&&fuSel.value?pl.use:'');
      const fdSel=$('fd');metaParts.push(fdSel&&fdSel.value?pl.dlbm:'');
      metaParts.push('@');
      txt+='\n'+metaParts.join(',');
      const oo=$('oo')?.checked;
      const ptsToShow=oo?pts:pts;
      ptsToShow.forEach((c,i)=>{
        let y=c[0].toFixed(prec),x=c[1].toFixed(prec);
        if(ox){const t=x;x=y;y=t}
        txt+=`\n${oj?'J':''}${i+1},1,${y},${x}`;
      });
    }
    if(plots.length>MAX_PLOTS) txt+=`\n; 共 ${plots.length} 个地块（此处仅显示前 ${MAX_PLOTS} 个）`;
  }

  const key=txt;
  if(key===lastPreviewKey) return;
  lastPreviewKey=key;
  const pv=$('pv');if(pv) pv.textContent=txt;
}

function init(){
  const s=localStorage.getItem('tg_dark');if(s)cfgs=JSON.parse(s);
  PP.forEach(p=>{if(!cfgs[p.id])cfgs[p.id]=p});
  renderChips();
  ld(localStorage.getItem('tg_last')||'basic');
  document.querySelectorAll('#R input,#R select,.pnl-l select,.pnl-m input,.pnl-m select').forEach(e=>{e.addEventListener('input',schedulePreview);e.addEventListener('change',schedulePreview)});
  document.querySelectorAll('#R input[type=checkbox],.pnl-m input[type=checkbox]').forEach(e=>e.addEventListener('change',schedulePreview));
  document.querySelectorAll('#hc,#hb,#hj,#hu,#hz,#ha,#ht').forEach(el=>{el.addEventListener('input',()=>{headerManual[el.id]=true});el.addEventListener('change',()=>{headerManual[el.id]=true})});
  initFileInput();
  up();
}

function renderChips(){
  const ch=$('ch');ch.innerHTML='';
  Object.values(cfgs).forEach(c=>ch.innerHTML+=`<span class="chip${c.id===cur?' on':''}" onclick="ld('${c.id}')">${c.n}</span>`);
}

function delCfg(){
  if(cur==='basic'||cur==='gov'||cur==='usr'){toast('内置预设不可删除');return}
  if(!confirm('确定删除方案「'+($('cn')?.textContent||'')+'」？')) return;
  delete cfgs[cur];
  localStorage.setItem('tg_dark',JSON.stringify(cfgs));
  cur='basic';ld('basic');
  renderChips();up();
  toast('已删除');
}

function ld(id){
  if(!id)return;const c=cfgs[id]||PP.find(p=>p.id===id);if(!c)return;cur=id;
  if(c.h){$('hc').value=c.h.c;$('hb').value=c.h.b;$('hj').value=c.h.j;$('hu').value=c.h.u;$('hz').value=c.h.z;$('ha').value=c.h.a;$('ht').value=c.h.t}
  if(c.p){$('pb')&&($('pb').value=c.p.pb);$('ox').checked=!!c.p.ox;$('oj').checked=!!c.p.oj;$('op').checked=!!c.p.op;$('on').checked=!!c.p.on;$('oo').checked=!!c.p.oo;$('om').checked=!!c.p.om}
  if(c.f)Object.keys(c.f).forEach(k=>{const e=$(k);if(e)e.value=c.f[k]});
  const cn=$('cn');if(cn)cn.textContent=c.n||'基础地块';
  document.querySelectorAll('.chip').forEach(e=>e.classList.remove('on'));
  const cp=document.querySelector(`.chip[onclick*="${id}"]`);if(cp)cp.classList.add('on');
  localStorage.setItem('tg_last',id);up();
}

function saveOnly(){
  const cn=$('cn');if(!cn)return;
  const newName=(cn.textContent||'').trim();
  if(!newName){toast('请输入配置名称');return}
  const c=g();
  // Find existing config with same name
  let existing=null;
  for(const [k,v] of Object.entries(cfgs)){
    if(v.n===newName){existing=v;break}
  }
  if(existing){
    c.id=existing.id;c.n=existing.n;
  }else{
    c.id='u'+Date.now();c.n=newName;
  }
  cfgs[c.id]=c;
  localStorage.setItem('tg_dark',JSON.stringify(cfgs));
  cur=c.id;cn.textContent=c.n;
  renderChips();
  toast('已保存 「'+c.n+'」');
}

function g(){return{id:cur,n:cfgs[cur]?.n||'默认',h:{c:$('hc').value,b:$('hb').value,j:$('hj').value,u:$('hu').value,z:$('hz').value,a:$('ha').value,t:$('ht').value},p:{pb:+($('pb')?.value||0),ox:$('ox').checked?1:0,oj:$('oj').checked?1:0,op:$('op').checked?1:0,on:$('on').checked?1:0,oo:$('oo').checked?1:0,om:$('om').checked?1:0},f:{fn:$('fn').value,fi:$('fi').value,fa:$('fa').value,fu:$('fu').value,fm:$('fm').value,fd:$('fd').value}}}

function sw(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.querySelector(`[data-t="${t}"]`).classList.add('on')}
function tp(id){$(id).classList.toggle('hide')}
function tg(h){const a=h.querySelector('.arr'),b=h.nextElementSibling;a.classList.toggle('o');b.classList.toggle('o')}
function switchHdrTab(t){
  document.querySelectorAll('.hdr-tab').forEach(e=>e.classList.toggle('on',e.textContent===(t==='attr'?'属性描述':'项目信息')));
