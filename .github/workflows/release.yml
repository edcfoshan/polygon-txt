# 极思G界址点互转工具 - 正式发布工作流
# 触发条件：推送 v* 格式的 tag（如 v3.2.0）

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release 标题用短版本（v3.2.0 → V3.2），与历史 Release（V3.0/V2.1）命名一致
      - name: Compute release title
        id: rel
        shell: bash
        run: echo "title=V$(echo '${{ github.ref_name }}' | sed 's/^v//; s/\.[^.]*$//')" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # CI 配置处理：严禁改写 productName（NSIS 卸载键/安装目录/快捷方式名均派生自它，改写曾致 v3.2 更新安装目录漂移）；
      # ASCII 产物名由下方构建后重命名步骤实现。此处仅按是否有私钥决定 updater 签名。
      - name: Patch Tauri config for CI
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置，禁用 updater 签名"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              if (c.plugins && c.plugins.updater) delete c.plugins.updater.pubkey;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
          else
            echo "TAURI_SIGNING_PRIVATE_KEY 已配置，保留 updater 签名"
          fi

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.rel.outputs.title }}
          releaseBody: |
            ## 极思G界址点互转工具 ${{ github.ref_name }}

            ### 下载说明
            - **Windows**: 下载 `.exe` 安装包或 `-portable.exe` 便携版
            - **macOS**: 下载 `.dmg` 安装包（arm64 = Apple Silicon, x64 = Intel）
            - **Linux**: 下载 `.AppImage` 或 `.deb`

            ### 系统要求
            - Windows 10/11 (64位)
            - macOS 10.15+ (Catalina 或更新)
            - Linux (需安装 WebKit2GTK)

            ### 更新日志
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Windows：生成 latest.json。资产有两层名字：slug（name，进 URL）会被 GitHub 静默剥掉
      # 非 ASCII（极思G界址点互转工具_X.exe → G._X.exe），label 才是 Release 列表显示的名字
      # （tauri-action 会自动把 label 设成中文原名）。所以 url 必须取 API 的真实
      # browser_download_url，绝不能再拼中文名——v4.4.0 就是拼了中文名导致 updater url 404。
      # 签名基于 exe 字节，与文件名无关。
      - name: Publish latest.json (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          D="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          REL_API="repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          # 优先取带 label 的那份（tauri-action 会把 label 设成中文原名；手工 ASCII 别名副本没有 label）
          SETUP_URL=$(gh api "$REL_API" -q '.assets[] | select((.label // "") | endswith("_x64-setup.exe")) | .browser_download_url' | head -1)
          if [ -z "$SETUP_URL" ]; then
            SETUP_URL=$(gh api "$REL_API" -q '.assets[] | select(.name | endswith("_x64-setup.exe")) | .browser_download_url' | head -1)
          fi
          if [ -z "$SETUP_URL" ]; then echo "::error::Release 上找不到 setup 资产，tauri-action 上传可能失败"; exit 1; fi
          DUPES=$(gh api "$REL_API" -q '[.assets[] | select((.name | endswith("_x64-setup.exe")) or ((.label // "") | endswith("_x64-setup.exe")))] | length')
          [ "$DUPES" -gt 1 ] && echo "::warning::Release 上有 $DUPES 份 setup，重复资产要清理（本次 updater 用 $SETUP_URL）"
          curl -sfIL --max-time 60 "$SETUP_URL" >/dev/null || { echo "::error::setup 下载链接不可达：$SETUP_URL"; exit 1; }
          if [ -z "$SETUP_URL" ]; then echo "::error::Release 上找不到 setup 资产，tauri-action 上传可能失败"; exit 1; fi
          curl -sfIL --max-time 60 "$SETUP_URL" >/dev/null || { echo "::error::setup 下载链接不可达：$SETUP_URL"; exit 1; }
          node scripts/gen-latest-json.js --version "$VER" --tag "${{ github.ref_name }}" --nsis-dir "$D" --download-url "$SETUP_URL"
          gh release upload "${{ github.ref_name }}" latest.json --clobber
          echo "已上传: latest.json（url=$SETUP_URL，已实测可达）"

      # Windows：用 CHANGELOG 具体更新内容替换 tauri-action 模板 notes（用户要求：Release 页直接展示更新内容）
      - name: Update release notes from CHANGELOG (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node scripts/extract-changelog.js "$VER" > release-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md --repo ${{ github.repository }}
          echo "Release notes 已更新为 CHANGELOG $VER 内容"

      # Windows 便携版：复制裸 exe 上传，并补 label。
      # gh release upload 不支持 label，而 GitHub 会把 slug 里的非 ASCII 剥成 "G._"——
      # 不补 label 时 Release 列表里就只有便携版显示成 G._*（tauri-action 会自动设 label）。
      # label 用 node 从 tauri.conf.json 读 productName 生成，避免中文经 shell 参数被改码。
      - name: Upload portable executable (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE="src-tauri/target/${{ matrix.target }}/release/jisig-bpoint-converter.exe"
          PORTABLE="src-tauri/target/${{ matrix.target }}/release/bundle/nsis/极思G界址点互转工具_${VER}_x64-portable.exe"
          cp "$EXE" "$PORTABLE"
          gh release upload "${{ github.ref_name }}" "$PORTABLE" --clobber
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            fs.writeFileSync('asset-label.json', JSON.stringify({ label: c.productName + '_' + process.argv[1] + '_x64-portable.exe' }));
          " "$VER"
          AID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            -q '.assets[] | select(.name | endswith("_x64-portable.exe")) | .id' | head -1)
          gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$AID" --input asset-label.json \
            -q '"便携版显示名 label=\(.label)"'

  # 最后一步：用 CHANGELOG 对应版本段落替换 latest.json 的 notes。
  # 根因：各平台 job 结束时 tauri-action 会合并平台条目并重传 latest.json，
  # notes 用发布页模板正文，会覆盖 Windows job 里 gen-latest-json 的提取版——
  # 本 job 在全部平台完成后运行，保证最终 notes = CHANGELOG 具体更新内容。
  finalize-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace latest.json notes with CHANGELOG content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "${{ github.ref_name }}" --repo ${{ github.repository }} --pattern latest.json --clobber
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const notes = execSync('node scripts/extract-changelog.js ' + process.argv[1]).toString().trim();
            const j = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            j.notes = notes;
            fs.writeFileSync('latest.json', JSON.stringify(j, null, 2) + '\n');
            console.log('latest.json notes replaced with CHANGELOG', process.argv[1]);
          " "$VER"
          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo ${{ github.repository }}
          echo "finalize-notes done"
