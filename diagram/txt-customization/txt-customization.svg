<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">一份界址点 TXT，有多少可以自定义</title>
  <desc id="desc">用示意 TXT 文件和四张说明卡展示项目信息、表头、字段映射、坐标列、编码与输出方式的自定义范围。</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#26354d" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 9 4 0 8" fill="none" stroke="#5eead4" stroke-width="1.7"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .eyebrow { fill:#5eead4; font-size:16px; font-weight:700; letter-spacing:2px; }
      .title { fill:#f8fafc; font-size:43px; font-weight:800; }
      .subtitle { fill:#b7c7d9; font-size:20px; }
      .paper-head { fill:#17263b; font-size:17px; font-weight:800; }
      .code { font-family:"Cascadia Code","Consolas",monospace; font-size:17px; }
      .label { fill:#f8fafc; font-size:19px; font-weight:800; }
      .body { fill:#bdcadd; font-size:15px; }
      .small { fill:#94a3b8; font-size:13px; }
      .pill { font-size:13px; font-weight:700; }
      .card { fill:#15243a; stroke:#31435b; stroke-width:1.2; }
      .line { stroke:#3c506b; stroke-width:1; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#0b1220"/>
  <rect width="1600" height="1160" fill="url(#grid)" opacity=".55"/>
  <circle cx="1490" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="130" cy="1050" r="210" fill="#0d9488" opacity=".08"/>

  <text x="64" y="62" class="eyebrow">TXT 解剖图 · 自定义地图</text>
  <text x="64" y="119" class="title">一份 TXT，能调多少？</text>
  <text x="66" y="157" class="subtitle">骨架有规矩，细节有得玩。先看懂这张“菜单”，再决定怎么出菜。</text>
  <g transform="translate(1280 68) rotate(7)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#fbbf24"/>
    <text x="110" y="27" text-anchor="middle" fill="#172033" font-size="15" font-weight="900">不是四列写死的哦</text>
  </g>

  <!-- TXT sample card -->
  <g filter="url(#shadow)">
    <rect x="56" y="196" width="690" height="836" rx="24" fill="#f8fafc"/>
  </g>
  <rect x="56" y="196" width="690" height="72" rx="24" fill="#e7f5f2"/>
  <path d="M56 244v24h690v-24" fill="#e7f5f2"/>
  <circle cx="91" cy="232" r="8" fill="#fb7185"/>
  <circle cx="117" cy="232" r="8" fill="#fbbf24"/>
  <circle cx="143" cy="232" r="8" fill="#34d399"/>
  <text x="176" y="238" class="paper-head">一份 TXT 的“身体结构”</text>
  <text x="687" y="237" text-anchor="end" fill="#0f766e" font-size="13" font-weight="800">三段式骨架</text>

  <rect x="82" y="291" width="638" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="98" y="306" width="139" height="27" rx="13" fill="#ffedd5"/>
  <text x="167" y="325" text-anchor="middle" fill="#c2410c" font-size="13" font-weight="800">可选 · 项目信息</text>
  <text x="101" y="359" class="code" fill="#475569">[项目信息]</text>
  <text x="101" y="384" class="code" fill="#475569">项目名称=春耕地块核查</text>
  <text x="696" y="359" text-anchor="end" fill="#c2410c" font-size="13" font-weight="700">想写几行都行</text>
  <text x="696" y="383" text-anchor="end" fill="#c2410c" font-size="13">也可以留空</text>

  <rect x="82" y="420" width="638" height="223" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="98" y="435" width="148" height="27" rx="13" fill="#dbeafe"/>
  <text x="172" y="454" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="800">属性描述 · 表头</text>
  <text x="101" y="490" class="code" fill="#334155">[属性描述]</text>
  <text x="101" y="521" class="code" fill="#0f766e">坐标系</text>
  <text x="184" y="521" class="code" fill="#64748b">=</text>
  <text x="204" y="521" class="code" fill="#334155">2000国家大地坐标系</text>
  <text x="101" y="550" class="code" fill="#0f766e">带号</text>
  <text x="184" y="550" class="code" fill="#64748b">=</text>
  <text x="204" y="550" class="code" fill="#334155">38</text>
  <text x="101" y="579" class="code" fill="#0f766e">精度</text>
  <text x="184" y="579" class="code" fill="#64748b">=</text>
  <text x="204" y="579" class="code" fill="#334155">0.001</text>
  <text x="101" y="615" fill="#64748b" font-size="13">默认 7 行起步：加行、删行、改键名、换顺序</text>
  <g transform="translate(590 439)">
    <rect width="105" height="28" rx="14" fill="#2563eb"/>
    <text x="52" y="19" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">随你排版 ↕</text>
  </g>

  <rect x="82" y="660" width="638" height="130" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="98" y="675" width="145" height="27" rx="13" fill="#ede9fe"/>
  <text x="170" y="694" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="800">地块属性行</text>
  <text x="101" y="735" class="code" fill="#334155">6, 1.2247, FID_0, DKMC, 面, ... , @</text>
  <text x="101" y="765" fill="#64748b" font-size="13">六个快捷映射位；高级模式可加字段、改顺序、存方案</text>
  <g transform="translate(598 674)">
    <rect width="96" height="27" rx="13" fill="#7c3aed"/>
    <text x="48" y="18" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">@ 收尾标记</text>
  </g>

  <rect x="82" y="807" width="638" height="198" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
  <rect x="98" y="822" width="151" height="27" rx="13" fill="#cffafe"/>
  <text x="173" y="841" text-anchor="middle" fill="#0e7490" font-size="13" font-weight="800">界址点坐标行</text>
  <g transform="translate(100 869)">
    <rect x="0" y="0" width="109" height="49" rx="9" fill="#0f766e"/>
    <rect x="115" y="0" width="91" height="49" rx="9" fill="#2563eb"/>
    <rect x="212" y="0" width="184" height="49" rx="9" fill="#7c3aed"/>
    <rect x="402" y="0" width="184" height="49" rx="9" fill="#ea580c"/>
    <text x="54" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">J1 点号</text>
    <text x="160" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1 环号</text>
    <text x="304" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">Y 北坐标</text>
    <text x="494" y="30" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">X 东坐标</text>
  </g>
  <text x="101" y="944" fill="#155e75" font-size="14" font-weight="700">4 个核心列都能拖动换位</text>
  <text x="101" y="972" fill="#475569" font-size="13">还能加：序号 · 固定值 · 源字段 · 点距离</text>
  <g transform="translate(590 820)">
    <rect width="105" height="27" rx="13" fill="#0891b2"/>
    <text x="52" y="18" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">4 + N 列</text>
  </g>

  <!-- Connector lines from sample to cards -->
  <path d="M746 345 C782 345 790 320 824 320" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M746 526 C786 526 788 495 824 495" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M746 722 C790 722 790 684 824 684" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M746 906 C788 906 790 872 824 872" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- Customization cards -->
  <g>
    <rect x="824" y="205" width="716" height="218" rx="20" class="card"/>
    <circle cx="868" cy="251" r="23" fill="#fb923c"/>
    <text x="868" y="258" text-anchor="middle" fill="#1f2937" font-size="18" font-weight="900">01</text>
    <text x="907" y="250" class="label">表头：七行只是起点</text>
    <text x="907" y="281" class="body">属性描述里的键值行可新增、删除、改名、排序。</text>
    <text x="907" y="307" class="body">项目信息是独立自由文本；不想写，也可以省略。</text>
    <line x1="907" y1="327" x2="1500" y2="327" class="line"/>
    <g transform="translate(907 348)">
      <rect width="118" height="34" rx="17" fill="#7c2d12"/>
      <text x="59" y="22" text-anchor="middle" fill="#fed7aa" class="pill">加 / 删 / 改名</text>
      <rect x="128" width="101" height="34" rx="17" fill="#7c2d12"/>
      <text x="178" y="22" text-anchor="middle" fill="#fed7aa" class="pill">拖动排序</text>
      <rect x="239" width="116" height="34" rx="17" fill="#7c2d12"/>
      <text x="297" y="22" text-anchor="middle" fill="#fed7aa" class="pill">自由写项目</text>
      <text x="382" y="22" class="small">回转用的 3 个坐标键名要保留</text>
    </g>
  </g>

  <g>
    <rect x="824" y="442" width="716" height="201" rx="20" class="card"/>
    <circle cx="868" cy="488" r="23" fill="#60a5fa"/>
    <text x="868" y="495" text-anchor="middle" fill="#102039" font-size="18" font-weight="900">02</text>
    <text x="907" y="487" class="label">属性：六个快捷位，或打开高级模式</text>
    <text x="907" y="519" class="body">名称、编号、面积、用途、图幅号、地类，常用项快速映射。</text>
    <text x="907" y="545" class="body">高级列可增删、改名、排序、映射源字段，也能保存方案。</text>
    <line x1="907" y1="565" x2="1500" y2="565" class="line"/>
    <text x="907" y="596" fill="#93c5fd" font-size="14" font-weight="700">自动面积 4 单位</text>
    <text x="1072" y="596" class="body">平方米 · 亩 · 公顷 · 平方千米</text>
    <text x="907" y="621" fill="#93c5fd" font-size="14" font-weight="700">数值精度 0–6 位</text>
    <text x="1072" y="621" class="body">简单 / 高级配置分别记住</text>
  </g>

  <g>
    <rect x="824" y="662" width="716" height="242" rx="20" class="card"/>
    <circle cx="868" cy="708" r="23" fill="#a78bfa"/>
    <text x="868" y="715" text-anchor="middle" fill="#21143c" font-size="18" font-weight="900">03</text>
    <text x="907" y="707" class="label">坐标行：四个核心列 + 四类扩展列</text>
    <text x="907" y="739" class="body">核心：点号、环号、Y、X，可拖动排序。</text>
    <text x="907" y="765" class="body">扩展：序号、固定值、源字段、点距离；想加几列就按需求加。</text>
    <line x1="907" y1="785" x2="1500" y2="785" class="line"/>
    <g transform="translate(907 807)">
      <rect width="99" height="34" rx="17" fill="#3b2b68"/><text x="49" y="22" text-anchor="middle" fill="#ddd6fe" class="pill">序号连续 / 重置</text>
      <rect x="109" width="108" height="34" rx="17" fill="#3b2b68"/><text x="163" y="22" text-anchor="middle" fill="#ddd6fe" class="pill">固定文本</text>
      <rect x="227" width="104" height="34" rx="17" fill="#3b2b68"/><text x="279" y="22" text-anchor="middle" fill="#ddd6fe" class="pill">选择源字段</text>
      <rect x="341" width="116" height="34" rx="17" fill="#3b2b68"/><text x="399" y="22" text-anchor="middle" fill="#ddd6fe" class="pill">点距离列</text>
    </g>
    <text x="907" y="877" class="small">每列可选米 / 千米 / 厘米、0–6 位精度；预览和导出共用这份布局。</text>
  </g>

  <g>
    <rect x="824" y="923" width="716" height="109" rx="20" fill="#103343" stroke="#0e7490" stroke-width="1.2"/>
    <text x="852" y="962" fill="#67e8f9" font-size="17" font-weight="800">收尾也能挑</text>
    <text x="852" y="991" class="body">UTF-8 / GBK</text>
    <circle cx="1005" cy="984" r="4" fill="#fbbf24"/>
    <text x="1023" y="991" class="body">一对一 / 按地块拆分 / 多源合并</text>
    <g transform="translate(1379 951) rotate(-5)">
      <rect width="128" height="47" rx="12" fill="#fbbf24"/>
      <text x="64" y="20" text-anchor="middle" fill="#172033" font-size="12" font-weight="900">先预览</text>
      <text x="64" y="36" text-anchor="middle" fill="#172033" font-size="12" font-weight="900">再交付 ✦</text>
    </g>
  </g>

  <text x="64" y="1090" fill="#94a3b8" font-size="14">一句话：格式骨架守规矩，表头 / 属性 / 坐标列 / 编码和输出方式，按项目来定。</text>
  <text x="1535" y="1090" text-anchor="end" fill="#5eead4" font-size="13" font-weight="700">极思G · 界址点 TXT</text>
</svg>
