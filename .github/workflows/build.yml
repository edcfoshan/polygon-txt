# 极思G界址点互转工具 - 跨平台 CI 构建测试
# 触发条件：push 代码、创建 PR、手动触发（仅测试构建，不发布）

name: CI Build Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # 手动触发

# 取消同一分支的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # CI 配置处理：严禁改写 productName（NSIS 卸载键/安装目录/快捷方式名均派生自它，改写曾致 v3.2 更新安装目录漂移）；
      # ASCII 产物名由 release.yml 构建后重命名实现。此处仅按是否有私钥决定 updater 签名。
      - name: Patch Tauri config for CI
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置，禁用 updater 签名"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              if (c.plugins && c.plugins.updater) delete c.plugins.updater.pubkey;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
          else
            echo "TAURI_SIGNING_PRIVATE_KEY 已配置，保留 updater 签名"
          fi

      - name: Build Tauri app (no release)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 7
