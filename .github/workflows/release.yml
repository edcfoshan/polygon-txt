# 极思G界址点互转工具 - 正式发布工作流
# 触发条件：推送 v* 格式的 tag（如 v3.2.0）

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg,app
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release 标题用短版本（v3.2.0 → V3.2），与历史 Release（V3.0/V2.1）命名一致
      - name: Compute release title
        id: rel
        shell: bash
        run: echo "title=V$(echo '${{ github.ref_name }}' | sed 's/^v//; s/\.[^.]*$//')" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # CI 配置处理：严禁改写 productName（NSIS 卸载键/安装目录/快捷方式名均派生自它，改写曾致 v3.2 更新安装目录漂移）；
      # ASCII 产物名由下方构建后重命名步骤实现。此处仅按是否有私钥决定 updater 签名。
      - name: Patch Tauri config for CI
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置，禁用 updater 签名"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              if (c.plugins && c.plugins.updater) delete c.plugins.updater.pubkey;
              fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            "
          else
            echo "TAURI_SIGNING_PRIVATE_KEY 已配置，保留 updater 签名"
          fi

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.rel.outputs.title }}
          releaseBody: |
            ## 极思G界址点互转工具 ${{ github.ref_name }}

            ### 下载说明
            - **Windows**: 下载 `.exe` 安装包或 `-portable.exe` 便携版
            - **macOS**: 下载 `.dmg` 安装包（arm64 = Apple Silicon, x64 = Intel）
            - **Linux**: 下载 `.AppImage` 或 `.deb`

            ### 系统要求
            - Windows 10/11 (64位)
            - macOS 10.15+ (Catalina 或更新)
            - Linux (需安装 WebKit2GTK)

            ### 更新日志
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Windows：setup 产物名恢复中文（productName 恒定），ASCII 名改为构建后重命名；
      # 顺序铁律：tauri-action → 重命名+生成 latest.json → upload clobber（覆盖 tauri-action 自动生成的 latest.json 与中文资产）
      - name: Publish ASCII-named setup and latest.json (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SHORT=${VER%.*}
          D="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          SETUP_SRC=$(ls "$D"/*_x64-setup.exe | head -1)
          cp "$SETUP_SRC" "$D/polygon-txt_${SHORT}_x64-setup.exe"
          cp "${SETUP_SRC}.sig" "$D/polygon-txt_${SHORT}_x64-setup.exe.sig"
          node scripts/gen-latest-json.js --version "$VER" --tag "${{ github.ref_name }}" --nsis-dir "$D"
          gh release upload "${{ github.ref_name }}" "$D/polygon-txt_${SHORT}_x64-setup.exe" "$D/polygon-txt_${SHORT}_x64-setup.exe.sig" latest.json --clobber
          echo "已上传: polygon-txt_${SHORT}_x64-setup.exe(.sig) + latest.json"

      # Windows 便携版：复制裸 exe 并上传到 Release
      - name: Upload portable executable (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE="src-tauri/target/${{ matrix.target }}/release/jisig-bpoint-converter.exe"
          PORTABLE="src-tauri/target/${{ matrix.target }}/release/bundle/nsis/polygon-txt_${VER%.*}_x64-portable.exe"
          cp "$EXE" "$PORTABLE"
          gh release upload "${{ github.ref_name }}" "$PORTABLE" --clobber
          echo "已上传便携版: $PORTABLE"
