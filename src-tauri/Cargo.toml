[package]
name = "jisig-bpoint-converter"
version = "4.7.0"
description = "界址点互转工具 — SHP/GDB ↔ TXT 双向转换"
authors = ["极思G"]
edition = "2021"
default-run = "jisig-bpoint-converter"

[lib]
name = "jisig_bpoint_converter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "diag_read_gdb"
path = "bin/diag_read_gdb.rs"

[[bin]]
name = "jisig-bpoint-converter"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "jisigg-cli"
path = "bin/cli.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-shell", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:winreg", "dep:windows", "dep:reqwest"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = "0.8"
dbase = "0.3"
encoding_rs = "0.8"
geonative-core = "0.2"
geonative-filegdb = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
proj-core = "0.9"
# 纯计算小 crate，全平台无条件引入：selfheal 的签名规范化（平台无关顶层函数）与测试都要用
base64 = "0.22"
minisign-verify = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.52", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
